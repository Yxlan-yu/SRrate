plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.yxlanyu.refreshrate'
    compileSdk 37

    defaultConfig {
        applicationId "com.yxlanyu.refreshrate"
        minSdk 24
        targetSdk 34
versionCode 136
    versionName "1.3.6"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.2'
    implementation 'top.yukonga.miuix.kmp:miuix-icons-android:0.9.2'
    implementation 'org.jetbrains.compose.ui:ui:1.11.1'
    implementation 'org.jetbrains.compose.runtime:runtime:1.11.1'
    implementation 'org.jetbrains.compose.foundation:foundation:1.11.1'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'com.github.MuntashirAkon:libadb-android:1.0.1'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.69'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.69'
    implementation 'org.conscrypt:conscrypt-android:2.6.3'
    implementation 'androidx.graphics:graphics-path:1.0.1'
    implementation 'androidx.work:work-runtime:2.10.0'
}