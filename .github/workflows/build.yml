name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Restore stable debug keystore
        env:
          KEY_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "::error ::DEBUG_KEYSTORE_B64 secret missing"
            exit 1
          fi
          echo "$KEY_B64" | base64 -d > app/debug.keystore

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: screen-refreshrate-debug
          path: app/build/outputs/apk/release/*.apk

      - name: Prepare release body + rename APK (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${{ github.ref_name }}"
          sed "s/__VER__/$VER/g" release_body.tpl.md > "release_body_$VER.md"
          cp app/build/outputs/apk/release/app-release.apk "./SRrate-$VER.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 刷新率 ${{ github.ref_name }}
          body_path: release_body_${{ github.ref_name }}.md
          files: SRrate-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release body + rename APK (version tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${{ github.ref_name }}"
          sed "s/__VER__/$VER/g" release_body.tpl.md > release_body_$VER.md
          cp app/build/outputs/apk/release/app-release.apk ./SRrate-$VER.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 刷新率 ${{ github.ref_name }}
          body_path: release_body_${{ github.ref_name }}.md
          files: SRrate-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
